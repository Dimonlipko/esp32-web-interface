; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Web interface for Huebner inverter
default_envs = release
src_dir = .
data_dir = data
extra_configs = platformio-local-override.ini

[common]
monitor_speed = 115200

[env]
platform = espressif32
framework = arduino
;board = esp32dev
board = esp32-c3-devkitm-1
board_build.filesystem = spiffs
; ESP32-C3: only dio_qspi / qio_qspi variants exist in framework-arduinoespressif32-libs.
; "qout" makes the build look for a non-existent sdkconfig.h and fails.
board_build.flash_mode = dio
build_src_filter = +<*> -<.git/> -<.svn/> -<src/flashloader>
;upload_port = /dev/ttyUSB0
monitor_speed = 115200
upload_speed = 921600

; Console over the native USB-Serial/JTAG of the C3 Super Mini,
; keeps UART0 pins (GPIO20/21) free for TWAI
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:release]
build_flags = 
	${env.build_flags}
	-D RELEASE
	-Wall -Werror
build_type = release
lib_deps = 
	bblanchon/ArduinoJson@^7.1.0
	bblanchon/StreamUtils@^1.7.3

[env:debug]
build_flags = 
	${env.build_flags}
	-D DEBUG
	-DDEBUG_ESP_PORT=Serial
	-DDEBUG_ESP_CORE
	-DDEBUG_ESP_WIFI
	-Wall -Werror
build_type = debug
lib_deps = 
	bblanchon/ArduinoJson@^7.1.0
	bblanchon/StreamUtils@^1.7.3
